<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Induk Mengerami</title>
<style>
  :root { --bg:#fdf8ee; --card:#fff; --ink:#3b2f20; --muted:#8a7a65; --accent:#d9822b; --ok:#3f8f5a; --warn:#c0392b; --line:#eadfc8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1913; --card:#292318; --ink:#f1e8d6; --muted:#a89877; --accent:#e8a05a; --ok:#6cc08a; --warn:#ef7b6c; --line:#3d3424; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:8px 0 2px; }
  input, select, textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:var(--warn); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .big { font-size:2.4rem; font-weight:700; line-height:1.1; }
  .muted { color:var(--muted); font-size:.9rem; }
  .bar { height:12px; border-radius:6px; background:var(--line); overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; background:var(--accent); transition:width .3s; }
  .alert { padding:10px 12px; border-radius:8px; margin-bottom:8px; background:#c0392b22; color:var(--warn); font-size:.92rem; }
  .alert.ok { background:#3f8f5a22; color:var(--ok); }
  .ms { display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--line); }
  .ms:last-child { border:0; }
  .ms input { width:auto; margin-top:5px; }
  .ms.now { font-weight:600; }
  .log { padding:8px 0; border-bottom:1px dashed var(--line); font-size:.92rem; }
  .log:last-child { border:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row button { flex:1; min-width:120px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>🐔 Monitor Induk Mengerami</h1>

  <!-- Setup -->
  <section id="setup" class="card" hidden>
    <h2>Mulai pengeraman baru</h2>
    <label>Nama / ciri induk</label>
    <input id="s-name" placeholder="mis. Si Putih">
    <div class="grid">
      <div><label>Jenis unggas</label>
        <select id="s-type">
          <option value="21">Ayam (21 hari)</option>
          <option value="28">Bebek (28 hari)</option>
          <option value="17">Puyuh (17 hari)</option>
          <option value="30">Angsa (30 hari)</option>
          <option value="28">Kalkun (28 hari)</option>
        </select></div>
      <div><label>Jumlah telur</label><input id="s-eggs" type="number" min="1" value="10"></div>
    </div>
    <label>Tanggal mulai mengeram</label>
    <input id="s-start" type="date">
    <p><button id="s-go">Mulai pantau</button></p>
  </section>

  <!-- Dashboard -->
  <div id="dash" hidden>
    <section class="card">
      <div class="muted" id="d-title"></div>
      <div class="big" id="d-day"></div>
      <div class="bar"><div id="d-bar"></div></div>
      <div class="muted" id="d-info"></div>
    </section>

    <section id="alerts"></section>

    <section class="card">
      <h2>Catat cepat</h2>
      <div class="row">
        <button data-q="nest">✅ Induk di sarang</button>
        <button data-q="turn">🔄 Telur dibalik</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" data-q="off">🚶 Induk keluar sarang</button>
        <button class="ghost" data-q="feed">💧 Pakan & minum</button>
      </div>
      <div class="grid">
        <div><label>Suhu sarang (°C, opsional)</label><input id="q-temp" type="number" step="0.1"></div>
        <div><label>Telur dibuang (retak/busuk)</label><input id="q-bad" type="number" min="0" value="0"></div>
      </div>
      <label>Catatan</label>
      <textarea id="q-note" rows="2" placeholder="mis. 2 telur gelap saat candling"></textarea>
      <p><button id="q-save" class="ghost">Simpan catatan / suhu / telur dibuang</button></p>
    </section>

    <section class="card">
      <h2>Jadwal & tahapan</h2>
      <div id="ms"></div>
    </section>

    <section class="card">
      <h2>Riwayat</h2>
      <div id="logs"></div>
    </section>

    <section class="card">
      <h2>Selesai / ulang</h2>
      <div class="row">
        <button class="ghost" id="a-export">Ekspor CSV</button>
        <button class="danger" id="a-reset">Hapus & mulai baru</button>
      </div>
    </section>
  </div>
</main>

<script>
const KEY = 'monitor-mengerami-v1';
const DAY = 86400000;
const $ = s => document.querySelector(s);
let st = load();

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOnly = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = d => d.toLocaleDateString('id-ID', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
const fmtTime = t => new Date(t).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

// Tonggak pengeraman, dihitung proporsional dari lama inkubasi (acuan ayam 21 hari)
function milestones(total) {
  const at = f => Math.max(1, Math.round(total * f));
  const list = [
    { day: at(7/21),  text: 'Candling pertama: cek telur kosong/tidak berembrio' },
    { day: at(14/21), text: 'Candling kedua: buang telur yang mati/busuk' },
    { day: at(18/21), text: 'Berhenti membalik telur, jangan diganggu lagi' },
    { day: total,     text: 'Perkiraan menetas — biarkan induk, jangan bantu mengupas' },
  ];
  return list.map(m => ({ ...m, id: 'd' + m.day }));
}

function init() {
  $('#s-start').value = ymd(new Date());
  render();
}

function render() {
  $('#setup').hidden = !!st;
  $('#dash').hidden = !st;
  if (!st) return;

  const start = dateOnly(st.start);
  const today = dateOnly(ymd(new Date()));
  const dayNo = Math.floor((today - start) / DAY) + 1;
  const hatch = new Date(start.getTime() + (st.total - 1) * DAY);
  const left = st.total - dayNo + 1;
  const alive = st.eggs - st.discarded;

  $('#d-title').textContent = `${st.name || 'Induk'} · ${alive} telur aktif dari ${st.eggs}`;
  $('#d-day').textContent = dayNo < 1 ? 'Belum mulai' : dayNo > st.total ? 'Waktunya menetas!' : `Hari ke-${dayNo} / ${st.total}`;
  $('#d-bar').style.width = Math.min(100, Math.max(0, dayNo / st.total * 100)) + '%';
  $('#d-info').textContent = `Mulai ${fmtDate(start)} · perkiraan menetas ${fmtDate(hatch)}` +
    (left > 0 && dayNo >= 1 ? ` (${left} hari lagi)` : '');

  renderAlerts(dayNo);
  renderMilestones(dayNo);
  renderLogs();
}

function renderAlerts(dayNo) {
  const box = $('#alerts'); box.innerHTML = '';
  const add = (msg, ok) => { const d = document.createElement('div'); d.className = 'alert' + (ok ? ' ok' : ''); d.textContent = msg; box.append(d); };
  const todayStr = ymd(new Date());
  const todays = st.logs.filter(l => ymd(new Date(l.t)) === todayStr);

  if (dayNo >= 1 && dayNo <= st.total) {
    if (!todays.some(l => l.type === 'nest')) add('Belum ada catatan "induk di sarang" hari ini.');
    if (!todays.some(l => l.type === 'feed')) add('Pakan & minum induk hari ini belum dicatat.');
    const mins = todays.filter(l => l.type === 'off').reduce((a, l) => a + (l.min || 0), 0);
    if (mins > 90) add(`Induk sudah meninggalkan sarang total ${mins} menit hari ini — telur bisa kedinginan.`);
    const last = [...st.logs].reverse().find(l => l.temp != null);
    if (last && (last.temp < 36 || last.temp > 39.5)) add(`Suhu sarang terakhir ${last.temp}°C di luar kisaran ideal (≈37–38,5°C).`);
  }
  if (dayNo > st.total) add('Sudah lewat perkiraan tetas. Tunggu 2–3 hari tambahan; telur yang tak menetas bisa diperiksa/dibuang.');
  if (!box.children.length) add('Semua aman. Lanjutkan pemantauan.', true);
}

function renderMilestones(dayNo) {
  $('#ms').innerHTML = '';
  for (const m of milestones(st.total)) {
    const row = document.createElement('div');
    row.className = 'ms' + (dayNo === m.day ? ' now' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!st.done[m.id];
    cb.onchange = () => { st.done[m.id] = cb.checked; save(); };
    const d = new Date(dateOnly(st.start).getTime() + (m.day - 1) * DAY);
    const txt = document.createElement('div');
    txt.textContent = `Hari ke-${m.day} (${fmtDate(d)}): ${m.text}` + (dayNo === m.day ? ' ← hari ini' : '');
    row.append(cb, txt);
    $('#ms').append(row);
  }
}

function renderLogs() {
  const box = $('#logs'); box.innerHTML = '';
  if (!st.logs.length) { box.innerHTML = '<div class="muted">Belum ada catatan.</div>'; return; }
  const label = { nest:'✅ Induk di sarang', turn:'🔄 Telur dibalik', off:'🚶 Induk keluar sarang', feed:'💧 Pakan & minum', note:'📝 Catatan' };
  [...st.logs].reverse().slice(0, 40).forEach(l => {
    const d = document.createElement('div'); d.className = 'log';
    let t = `${fmtTime(l.t)} — ${label[l.type] || l.type}`;
    if (l.min != null) t += ` (${l.min} menit)`;
    if (l.temp != null) t += ` · ${l.temp}°C`;
    if (l.bad) t += ` · ${l.bad} telur dibuang`;
    if (l.note) t += ` · ${l.note}`;
    d.textContent = t; box.append(d);
  });
}

function addLog(entry) { st.logs.push({ t: Date.now(), ...entry }); save(); render(); }

$('#s-go').onclick = () => {
  const eggs = parseInt($('#s-eggs').value, 10);
  if (!eggs || eggs < 1 || !$('#s-start').value) return alert('Isi jumlah telur dan tanggal mulai.');
  st = { name: $('#s-name').value.trim(), total: parseInt($('#s-type').value, 10), eggs,
         start: $('#s-start').value, discarded: 0, logs: [], done: {} };
  save(); render();
};

document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
  const type = b.dataset.q;
  if (type === 'off') {
    const m = parseInt(prompt('Berapa menit induk keluar sarang?', '20'), 10);
    if (!m || m < 1) return;
    return addLog({ type, min: m });
  }
  addLog({ type });
});

$('#q-save').onclick = () => {
  const temp = $('#q-temp').value === '' ? null : parseFloat($('#q-temp').value);
  const bad = parseInt($('#q-bad').value, 10) || 0;
  const note = $('#q-note').value.trim();
  if (temp == null && !bad && !note) return;
  if (bad > st.eggs - st.discarded) return alert('Jumlah melebihi telur aktif.');
  st.discarded += bad;
  addLog({ type: 'note', temp, bad: bad || undefined, note: note || undefined });
  $('#q-temp').value = ''; $('#q-bad').value = 0; $('#q-note').value = '';
};

$('#a-export').onclick = () => {
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['waktu','jenis','menit_keluar','suhu_c','telur_dibuang','catatan'].join(',')]
    .concat(st.logs.map(l => [q(new Date(l.t).toISOString()), l.type, l.min ?? '', l.temp ?? '', l.bad ?? '', q(l.note)].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = 'log-mengerami.csv'; a.click();
};

$('#a-reset').onclick = () => {
  if (!confirm('Hapus semua data pengeraman ini?')) return;
  st = null; try { localStorage.removeItem(KEY); } catch {} render();
};

init();
</script>
</body>
</html>
